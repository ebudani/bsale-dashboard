<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AestheticsPro · Mi Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>

<div id="pin-gate">
  <div class="pin-box">
    <h1>AestheticsPro <span>· Ventas</span></h1>
    <p>Ingresá el PIN para continuar</p>
    <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
    <button id="pin-submit">Entrar</button>
    <div id="pin-error">PIN incorrecto</div>
  </div>
</div>

<header>
  <h1>AestheticsPro <span>· Ventas</span></h1>
  <div class="header-right">
    <span id="updated-at">Cargando…</span>
    <!-- No hay selector de Vendedor: esta vista queda fija a quien indique ?v= -->
    <div class="filter-group" id="vendor-filter-group" style="display:none">
      <span class="filter-label">Vendedor</span>
      <select id="vendor-select" class="filter-select" onchange="selectVendor(this.value)"></select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Periodo</span>
      <select id="period-select" class="filter-select" onchange="onPeriodChange(this.value)">
        <option value="this_month">Este mes</option>
        <option value="prev_month">Mes anterior</option>
        <option value="this_year">Año actual</option>
        <option value="prev_year">Año anterior</option>
        <option value="all_time">Todo</option>
        <option value="custom">Personalizar</option>
      </select>
      <div id="custom-range">
        <span class="filter-label">Desde</span>
        <select id="custom-from" class="filter-select" onchange="onCustomRangeChange()"></select>
        <span class="filter-label">Hasta</span>
        <select id="custom-to" class="filter-select" onchange="onCustomRangeChange()"></select>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="loading">Cargando datos…</div>
  <div id="content">

    <!-- KPI Row -->
    <div class="kpi-grid">
      <div class="kpi">
        <label>Venta neta total</label>
        <div class="val" id="kpi-total">—</div>
        <div class="sub" id="kpi-total-sub">—</div>
      </div>
      <div class="kpi teox">
        <label>Teoxane</label>
        <div class="val" id="kpi-teox">—</div>
        <div class="sub" id="kpi-teox-sub">—</div>
      </div>
      <div class="kpi rrs">
        <label>RRS HA Long Lasting</label>
        <div class="val" id="kpi-rrs">—</div>
        <div class="sub" id="kpi-rrs-sub">—</div>
      </div>
      <div class="kpi" id="kpi-cumpl-card">
        <label>Cumplimiento total</label>
        <div class="val" id="kpi-cumpl">—</div>
        <div class="sub" id="kpi-cumpl-sub">—</div>
      </div>
      <div class="kpi">
        <label>Facturas emitidas</label>
        <div class="val" id="kpi-docs">—</div>
        <div class="sub" id="kpi-docs-sub">—</div>
      </div>
    </div>

    <!-- Detalle de cumplimiento por marca -->
    <div class="card">
      <h2>Detalle de Cumplimiento</h2>
      <div id="cumpl-detail"></div>
    </div>

  </div><!-- #content -->
</main>

<script>
  window.SIMPLE_MODE = true;
  // Which vendor this link is pinned to -- ?v=monica etc. Add a new entry
  // here (not a new HTML file) any time another vendor needs their own link.
  const VENDOR_LINKS = {
    monica: 'Monica Urrutia',
    daisy: 'Daisy Ponce',
    cindy: 'Cindy Monsalves',
    francisca: 'Francisca Salinas',
  };
  const code = new URLSearchParams(location.search).get('v');
  // Unknown/missing code still sets LOCKED_VENDOR (to a value no real vendor
  // has) so dashboard.js's applyVendorLock() shows its "link inválido" error
  // instead of silently falling through to the unlocked all-vendors view.
  window.LOCKED_VENDOR = VENDOR_LINKS[code] || '__invalid__';
</script>
<script src="assets/dashboard.js"></script>
</body>
</html>
