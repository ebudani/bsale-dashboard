<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AestheticsPro · Dashboard Ventas</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --navy:    #0f2547;
    --blue:    #1d4ed8;
    --teox:    #2563eb;
    --rrs:     #d97706;
    --fine:    #059669;
    --green:   #16a34a;
    --red:     #dc2626;
    --gray-50: #f8fafc;
    --gray-100:#f1f5f9;
    --gray-200:#e2e8f0;
    --gray-600:#475569;
    --gray-900:#0f172a;
    --white:   #ffffff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--gray-50); color: var(--gray-900); font-size: 14px; }

  /* Header */
  header {
    background: var(--navy);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
  header h1 span { color: #93c5fd; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  #updated-at { font-size: 11px; color: #94a3b8; }

  /* Month selector */
  #month-select {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.3);
    color: white;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  #month-select option { background: var(--navy); color: white; }

  /* Main layout */
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  /* KPI cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi {
    background: white;
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    border-left: 4px solid var(--blue);
  }
  .kpi.teox  { border-color: var(--teox); }
  .kpi.rrs   { border-color: var(--rrs); }
  .kpi.green { border-color: var(--green); }
  .kpi.red   { border-color: var(--red); }
  .kpi label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--gray-600); display: block; margin-bottom: 6px; }
  .kpi .val  { font-size: 22px; font-weight: 700; }
  .kpi .sub  { font-size: 11px; color: var(--gray-600); margin-top: 3px; }

  /* Charts row */
  .charts-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
    margin-bottom: 22px;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-600);
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-bottom: 14px;
  }

  .chart-wrap { position: relative; height: 220px; }

  /* Tables row */
  .tables-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 22px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: var(--gray-100);
    padding: 8px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--gray-600);
    border-bottom: 1px solid var(--gray-200);
  }
  td { padding: 8px 10px; border-bottom: 1px solid var(--gray-200); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .pill.ok  { background: #dcfce7; color: #15803d; }
  .pill.low { background: #fee2e2; color: #b91c1c; }
  .pill.mid { background: #fef3c7; color: #92400e; }

  /* Wide chart */
  .full-row { margin-bottom: 22px; }
  .full-row .chart-wrap { height: 200px; }

  /* Daily + brand side by side */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 22px;
  }
  .bottom-row .chart-wrap { height: 180px; }

  /* Loading state */
  #loading { text-align: center; padding: 60px; color: var(--gray-600); font-size: 16px; }
  #content { display: none; }

  @media (max-width: 900px) {
    .charts-row, .tables-row, .bottom-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>AestheticsPro <span>· Ventas</span></h1>
  <div class="header-right">
    <span id="updated-at">Cargando…</span>
    <select id="month-select" onchange="selectMonth(this.value)"></select>
  </div>
</header>

<main>
  <div id="loading">Cargando datos…</div>
  <div id="content">

    <!-- KPI Row -->
    <div class="kpi-grid">
      <div class="kpi">
        <label>Venta neta total</label>
        <div class="val" id="kpi-total">—</div>
        <div class="sub" id="kpi-total-sub">—</div>
      </div>
      <div class="kpi teox">
        <label>Teoxane</label>
        <div class="val" id="kpi-teox">—</div>
        <div class="sub" id="kpi-teox-sub">—</div>
      </div>
      <div class="kpi rrs">
        <label>RRS HA Long Lasting</label>
        <div class="val" id="kpi-rrs">—</div>
        <div class="sub" id="kpi-rrs-sub">—</div>
      </div>
      <div class="kpi" id="kpi-cumpl-card">
        <label>Cumplimiento total</label>
        <div class="val" id="kpi-cumpl">—</div>
        <div class="sub" id="kpi-cumpl-sub">—</div>
      </div>
      <div class="kpi">
        <label>Facturas emitidas</label>
        <div class="val" id="kpi-docs">—</div>
        <div class="sub" id="kpi-docs-sub">—</div>
      </div>
    </div>

    <!-- Main charts -->
    <div class="full-row card">
      <h2>Ventas Netas Mensuales</h2>
      <div class="chart-wrap"><canvas id="chart-monthly"></canvas></div>
    </div>

    <!-- Daily + Brand by month -->
    <div class="bottom-row">
      <div class="card">
        <h2 id="chart-daily-title">Curva Diaria — </h2>
        <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
      </div>
      <div class="card">
        <h2>Marcas por Mes (últimos 12)</h2>
        <div class="chart-wrap"><canvas id="chart-brands"></canvas></div>
      </div>
    </div>

    <!-- Vendor / cumplimiento table -->
    <div class="tables-row">
      <div class="card">
        <h2 id="table-vendor-title">Vendedores — </h2>
        <table id="table-vendor">
          <thead>
            <tr>
              <th>Vendedor</th>
              <th>Neto</th>
              <th>Teoxane</th>
              <th>RRS</th>
            </tr>
          </thead>
          <tbody id="tbody-vendor"></tbody>
        </table>
      </div>
      <div class="card">
        <h2 id="table-cumpl-title">Cumplimiento — </h2>
        <table id="table-cumpl">
          <thead>
            <tr>
              <th>Vendedor</th>
              <th>Teoxane</th>
              <th>vs Obj</th>
              <th>RRS</th>
              <th>vs Obj</th>
            </tr>
          </thead>
          <tbody id="tbody-cumpl"></tbody>
        </table>
      </div>
    </div>

    <!-- Top clients -->
    <div class="card">
      <h2 id="table-clients-title">Top 10 Clientes — </h2>
      <table>
        <thead>
          <tr>
            <th>#</th><th>Cliente</th><th>Facturas</th><th>Neto</th><th>% del mes</th>
          </tr>
        </thead>
        <tbody id="tbody-clients"></tbody>
      </table>
    </div>

  </div><!-- #content -->
</main>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
const BRANDS = ['Teoxane', 'RRS HA Long Lasting'];
const BRAND_COLORS = { 'Teoxane': '#2563eb', 'RRS HA Long Lasting': '#d97706', 'FINE': '#059669' };

// ── State ──────────────────────────────────────────────────────────────────
let allMonths = [];
let usersMap  = {};
let targetsData = {};
let selectedIdx = 0;
let chartMonthly, chartDaily, chartBrands;

// ── Formatting ─────────────────────────────────────────────────────────────
const CLP = v => new Intl.NumberFormat('es-CL', {
  style: 'currency', currency: 'CLP', maximumFractionDigits: 0
}).format(v);

const M = v => {
  if (Math.abs(v) >= 1e9) return `$${(v/1e9).toFixed(1)}B`;
  if (Math.abs(v) >= 1e6) return `$${(v/1e6).toFixed(1)}M`;
  return CLP(v);
};

const PCT = v => `${(v * 100).toFixed(1)}%`;

function monthLabel(year, month) {
  const names = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${names[month-1]}-${String(year).slice(2)}`;
}

function pillClass(ratio) {
  if (ratio >= 1.0) return 'ok';
  if (ratio >= 0.85) return 'mid';
  return 'low';
}

// ── Load ────────────────────────────────────────────────────────────────────
async function loadData() {
  const [vRes, tRes] = await Promise.all([
    fetch('data/ventas.json'),
    fetch('data/targets.json')
  ]);
  const ventas  = await vRes.json();
  const targets = await tRes.json();

  allMonths   = ventas.months || [];
  usersMap    = ventas.users  || {};
  targetsData = targets.months || {};

  document.getElementById('updated-at').textContent =
    'Actualizado: ' + (ventas.updated_at || '').slice(0, 16).replace('T', ' ') + ' UTC';

  buildSelector();
  selectedIdx = allMonths.length - 1;
  document.getElementById('month-select').value = selectedIdx;
  render();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// ── Month selector ──────────────────────────────────────────────────────────
function buildSelector() {
  const sel = document.getElementById('month-select');
  allMonths.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = monthLabel(m.year, m.month);
    sel.appendChild(opt);
  });
}

function selectMonth(idx) {
  selectedIdx = parseInt(idx);
  render();
}

// ── Render all ──────────────────────────────────────────────────────────────
function render() {
  const m = allMonths[selectedIdx];
  const label = monthLabel(m.year, m.month);
  const key = `${m.year}-${String(m.month).padStart(2,'0')}`;
  const t = targetsData[key] || null;

  renderKPIs(m, t, label);
  renderMonthlyChart();
  renderDailyChart(m, label);
  renderBrandsChart();
  renderVendorTable(m, label);
  renderCumplTable(m, t, label);
  renderTopClients(m, label);
}

// ── KPI Cards ───────────────────────────────────────────────────────────────
function renderKPIs(m, t, label) {
  const teox = (m.by_brand || {})['Teoxane'] || 0;
  const rrs  = (m.by_brand || {})['RRS HA Long Lasting'] || 0;

  document.getElementById('kpi-total').textContent = M(m.total_neto);
  document.getElementById('kpi-total-sub').textContent =
    `${m.count_facturas} fact · ${m.count_nc} NC`;

  document.getElementById('kpi-teox').textContent = M(teox);
  if (t && t.total) {
    const tTeox = sumVendorTargets(t, 'Teoxane');
    document.getElementById('kpi-teox-sub').textContent =
      `Obj: ${M(tTeox)} · ${PCT(tTeox ? teox/tTeox : 0)}`;
  } else {
    document.getElementById('kpi-teox-sub').textContent = `${PCT(m.total_neto ? teox/m.total_neto : 0)} del total`;
  }

  document.getElementById('kpi-rrs').textContent = M(rrs);
  if (t && t.total) {
    const tRrs = sumVendorTargets(t, 'RRS HA Long Lasting');
    document.getElementById('kpi-rrs-sub').textContent =
      `Obj: ${M(tRrs)} · ${PCT(tRrs ? rrs/tRrs : 0)}`;
  } else {
    document.getElementById('kpi-rrs-sub').textContent = `${PCT(m.total_neto ? rrs/m.total_neto : 0)} del total`;
  }

  if (t && t.total) {
    const ratio = m.total_neto / t.total;
    document.getElementById('kpi-cumpl').textContent = PCT(ratio);
    document.getElementById('kpi-cumpl-sub').textContent = `Obj: ${M(t.total)}`;
    const card = document.getElementById('kpi-cumpl-card');
    card.className = `kpi ${ratio >= 1 ? 'green' : ratio >= 0.85 ? '' : 'red'}`;
  } else {
    document.getElementById('kpi-cumpl').textContent = '—';
    document.getElementById('kpi-cumpl-sub').textContent = 'Sin objetivo';
  }

  document.getElementById('kpi-docs').textContent = m.count_facturas + m.count_nc;
  document.getElementById('kpi-docs-sub').textContent =
    `Neto fact: ${M(m.neto_facturas)} · NC: ${M(m.neto_nc)}`;
}

function sumVendorTargets(t, brand) {
  return Object.values(t.by_vendor || {}).reduce((s, bv) => s + (bv[brand] || 0), 0);
}

// ── Monthly trend chart ─────────────────────────────────────────────────────
function renderMonthlyChart() {
  const labels = allMonths.map(m => monthLabel(m.year, m.month));
  const totals = allMonths.map(m => m.total_neto);
  const teoxs  = allMonths.map(m => (m.by_brand || {})['Teoxane'] || 0);
  const rrss   = allMonths.map(m => (m.by_brand || {})['RRS HA Long Lasting'] || 0);

  if (chartMonthly) chartMonthly.destroy();
  chartMonthly = new Chart(document.getElementById('chart-monthly'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Teoxane',
          data: teoxs,
          backgroundColor: BRAND_COLORS['Teoxane'] + 'cc',
          borderRadius: 4,
          stack: 'brands',
        },
        {
          label: 'RRS HA Long Lasting',
          data: rrss,
          backgroundColor: BRAND_COLORS['RRS HA Long Lasting'] + 'cc',
          borderRadius: 4,
          stack: 'brands',
        },
        {
          label: 'Total neto',
          data: totals,
          type: 'line',
          borderColor: '#0f172a',
          backgroundColor: 'transparent',
          pointRadius: 3,
          pointBackgroundColor: '#0f172a',
          borderWidth: 1.5,
          tension: 0.2,
          yAxisID: 'y',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${M(ctx.raw)}`
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        y: {
          ticks: {
            font: { size: 10 },
            callback: v => M(v)
          },
          grid: { color: '#f1f5f9' }
        }
      }
    }
  });
}

// ── Daily chart ──────────────────────────────────────────────────────────────
function renderDailyChart(m, label) {
  document.getElementById('chart-daily-title').textContent = `Curva Diaria — ${label}`;
  const days = (m.by_day || []);
  const lbl  = days.map(d => d.date.slice(8));  // DD
  const vals = days.map(d => d.neto);

  // Running total
  let acc = 0;
  const running = vals.map(v => (acc += v));

  if (chartDaily) chartDaily.destroy();
  chartDaily = new Chart(document.getElementById('chart-daily'), {
    type: 'bar',
    data: {
      labels: lbl,
      datasets: [
        {
          label: 'Neto diario',
          data: vals,
          backgroundColor: '#93c5fd',
          borderRadius: 2,
          yAxisID: 'y',
        },
        {
          label: 'Acumulado',
          data: running,
          type: 'line',
          borderColor: '#1d4ed8',
          backgroundColor: 'transparent',
          pointRadius: 0,
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y2',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${M(ctx.raw)}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 9 } } },
        y:  { display: false },
        y2: {
          position: 'right',
          ticks: { font: { size: 9 }, callback: v => M(v) },
          grid: { color: '#f1f5f9' }
        }
      }
    }
  });
}

// ── Brands per month (last 12) ───────────────────────────────────────────────
function renderBrandsChart() {
  const last12 = allMonths.slice(-12);
  const labels = last12.map(m => monthLabel(m.year, m.month));

  if (chartBrands) chartBrands.destroy();
  chartBrands = new Chart(document.getElementById('chart-brands'), {
    type: 'line',
    data: {
      labels,
      datasets: BRANDS.map(b => ({
        label: b === 'RRS HA Long Lasting' ? 'RRS' : b,
        data: last12.map(m => (m.by_brand || {})[b] || 0),
        borderColor: BRAND_COLORS[b],
        backgroundColor: BRAND_COLORS[b] + '22',
        pointRadius: 3,
        borderWidth: 2,
        tension: 0.3,
        fill: false,
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${M(ctx.raw)}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 9 } } },
        y: { ticks: { font: { size: 9 }, callback: v => M(v) }, grid: { color: '#f1f5f9' } }
      }
    }
  });
}

// ── Vendor table ─────────────────────────────────────────────────────────────
function renderVendorTable(m, label) {
  document.getElementById('table-vendor-title').textContent = `Vendedores — ${label}`;
  const bv    = m.by_vendor || {};
  const bvb   = m.by_vendor_brand || {};
  const tbody = document.getElementById('tbody-vendor');
  tbody.innerHTML = '';

  const rows = Object.entries(bv)
    .map(([uid, v]) => ({uid, ...v}))
    .sort((a, b) => b.neto - a.neto);

  rows.forEach(r => {
    const name  = usersMap[r.uid] || r.uid;
    const teox  = (bvb[r.uid] || {})['Teoxane'] || 0;
    const rrs   = (bvb[r.uid] || {})['RRS HA Long Lasting'] || 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${name}</strong></td>
      <td>${M(r.neto)}</td>
      <td style="color:${BRAND_COLORS['Teoxane']}">${M(teox)}</td>
      <td style="color:${BRAND_COLORS['RRS HA Long Lasting']}">${M(rrs)}</td>
    `;
    tbody.appendChild(tr);
  });

  // Total row
  const totNeto = rows.reduce((s, r) => s + r.neto, 0);
  const totTeox = rows.reduce((s, r) => s + ((bvb[r.uid]||{})['Teoxane']||0), 0);
  const totRrs  = rows.reduce((s, r) => s + ((bvb[r.uid]||{})['RRS HA Long Lasting']||0), 0);
  const tfoot = document.createElement('tr');
  tfoot.style.fontWeight = '700';
  tfoot.style.background = '#f8fafc';
  tfoot.innerHTML = `
    <td>Total</td>
    <td>${M(totNeto)}</td>
    <td style="color:${BRAND_COLORS['Teoxane']}">${M(totTeox)}</td>
    <td style="color:${BRAND_COLORS['RRS HA Long Lasting']}">${M(totRrs)}</td>
  `;
  tbody.appendChild(tfoot);
}

// ── Cumplimiento table ───────────────────────────────────────────────────────
function renderCumplTable(m, t, label) {
  document.getElementById('table-cumpl-title').textContent = `Cumplimiento — ${label}`;
  const bvb   = m.by_vendor_brand || {};
  const tbody = document.getElementById('tbody-cumpl');
  tbody.innerHTML = '';

  if (!t) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:#94a3b8;text-align:center">Sin objetivos para este mes</td></tr>';
    return;
  }

  const vendorIds = Object.keys(t.by_vendor || {});
  vendorIds.forEach(uid => {
    const name    = usersMap[uid] || uid;
    const real    = bvb[uid] || {};
    const targets = t.by_vendor[uid] || {};
    const teoxReal = real['Teoxane'] || 0;
    const teoxObj  = targets['Teoxane'] || 0;
    const rrsReal  = real['RRS HA Long Lasting'] || 0;
    const rrsObj   = targets['RRS HA Long Lasting'] || 0;
    const teoxR = teoxObj ? teoxReal/teoxObj : null;
    const rrsR  = rrsObj  ? rrsReal/rrsObj   : null;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${name}</strong></td>
      <td style="color:${BRAND_COLORS['Teoxane']}">${M(teoxReal)}</td>
      <td>${teoxR !== null ? `<span class="pill ${pillClass(teoxR)}">${PCT(teoxR)}</span><br><small>${M(teoxObj)}</small>` : '—'}</td>
      <td style="color:${BRAND_COLORS['RRS HA Long Lasting']}">${M(rrsReal)}</td>
      <td>${rrsR !== null ? `<span class="pill ${pillClass(rrsR)}">${PCT(rrsR)}</span><br><small>${M(rrsObj)}</small>` : '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  // Total row
  const totTeox = vendorIds.reduce((s, u) => s + ((bvb[u]||{})['Teoxane']||0), 0);
  const totRrs  = vendorIds.reduce((s, u) => s + ((bvb[u]||{})['RRS HA Long Lasting']||0), 0);
  const tTeox   = vendorIds.reduce((s, u) => s + ((t.by_vendor[u]||{})['Teoxane']||0), 0);
  const tRrs    = vendorIds.reduce((s, u) => s + ((t.by_vendor[u]||{})['RRS HA Long Lasting']||0), 0);
  const tr2 = document.createElement('tr');
  tr2.style.fontWeight = '700';
  tr2.style.background = '#f8fafc';
  tr2.innerHTML = `
    <td>Total</td>
    <td style="color:${BRAND_COLORS['Teoxane']}">${M(totTeox)}</td>
    <td>${tTeox ? `<span class="pill ${pillClass(totTeox/tTeox)}">${PCT(totTeox/tTeox)}</span><br><small>${M(tTeox)}</small>` : '—'}</td>
    <td style="color:${BRAND_COLORS['RRS HA Long Lasting']}">${M(totRrs)}</td>
    <td>${tRrs ? `<span class="pill ${pillClass(totRrs/tRrs)}">${PCT(totRrs/tRrs)}</span><br><small>${M(tRrs)}</small>` : '—'}</td>
  `;
  tbody.appendChild(tr2);
}

// ── Top clients ──────────────────────────────────────────────────────────────
function renderTopClients(m, label) {
  document.getElementById('table-clients-title').textContent = `Top 10 Clientes — ${label}`;
  const tbody = document.getElementById('tbody-clients');
  tbody.innerHTML = '';
  const top = (m.top_clients || []).slice(0, 10);
  top.forEach((c, i) => {
    const pct = m.total_neto ? (c.neto / m.total_neto * 100).toFixed(1) : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:#94a3b8;width:28px">${i+1}</td>
      <td><strong>${c.name}</strong></td>
      <td>${c.count}</td>
      <td>${M(c.neto)}</td>
      <td>${pct}%</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Init ─────────────────────────────────────────────────────────────────────
loadData().catch(err => {
  document.getElementById('loading').textContent = 'Error al cargar datos: ' + err.message;
});
</script>
